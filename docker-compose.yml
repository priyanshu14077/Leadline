services:
  db:
    image: postgres:16-alpine
    container_name: leadline-db
    environment:
      POSTGRES_USER: leadline
      POSTGRES_PASSWORD: leadline
      POSTGRES_DB: leadline
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadline"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
    name: leadline_pgdata
